name: ci

# Runs the repository quality gate. scripts/check.sh builds the development
# image and then runs clang-format, the build with warnings as errors, the unit
# tests, the address/undefined and thread sanitizers, clang-tidy and the colcon
# build of the ROS 2 packages. The GPU link check is not run here.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Run the quality gate
        run: ./scripts/check.sh

name: ci

# Runs the same checks as scripts/check.sh: build, unit tests, sanitizers,
# clang-tidy and clang-format. The GPU link check is not run here.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Build the Lotse development image
        run: docker build -f docker/lotse-dev.Dockerfile -t lotse-dev:jazzy docker

      - name: Run the quality gate
        run: ./scripts/check.sh

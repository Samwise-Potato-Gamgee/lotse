# Lotse service configuration for the end-to-end script: no delays and a high
# tick rate so a full order list completes in seconds. Same keys as lotse.conf.

# Map file with the stations and parking cells.
map = maps/warehouse_large.map
# Number of robots in the grid simulator.
fleet_size = 5
# Fleet planner: prioritized or cbs.
planner = prioritized
# Interface the HTTP API listens on. 127.0.0.1 keeps it on this machine.
bind_address = 127.0.0.1
# TCP port of the HTTP API and dashboard.
port = 8080
# SQLite file where orders and their states are kept.
database = /data/lotse-e2e.db
# Directory with the dashboard files served by the service.
dashboard = service/dashboard
# Simulated seconds for one grid cell at full robot speed.
cell_seconds = 1.0
# Ticker steps per wall second.
tick_rate_hz = 400.0
# Simulated seconds one ticker step covers.
sim_seconds_per_tick = 1.0
# Wall-clock limit for one background planning call, in milliseconds.
plan_time_limit_ms = 500
# Simulated seconds between two replans of the fleet.
replan_window_seconds = 40.0
# Simulated seconds of waiting that add one priority point, so old orders do not starve.
priority_ageing_seconds = 25.0
# Simulated seconds with no robot progress and open orders before the fleet counts as stuck.
deadlock_patience_seconds = 400.0
# Plan on a worker thread so robots keep moving while planning runs.
background_planning = true
# Enforce the pass-order rule. Turning it off is only for the safety control.
pass_order = true
# Per-leg chance that a robot moves at a lower speed.
slowdown_probability = 0.0
# Per-leg chance that a robot pauses for a moment before starting.
stop_probability = 0.0
# Seed of the simulator delay draws, so a run is repeatable.
sim_seed = 3

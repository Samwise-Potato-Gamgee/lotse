# Lotse Isaac Sim demo configuration. Every setting has a comment because the
# values are tuning, not code: the driver parameters were retuned for the Carter
# in real physics, where the robot has mass, wheels that slip and a real
# forward range sensor (20 physics ray casts published as a laser scan).

# Map file built into the Isaac Sim scene.
map_path = maps/warehouse_small.map
# Number of robots placed at the parking cells.
fleet_size = 4
# Metres per grid cell; the whole pipeline shares this.
cell_size = 1.0
# Manager grid steps per simulated second.
tick_hz = 20.0
# Orders in the fixed demo list.
order_count = 12
# Grid steps between two order arrivals.
arrival_interval = 10
# Seed of the fixed order list.
seed = 1
# Wall-clock limit for one background planning call, in milliseconds.
plan_time_limit_ms = 500
# Simulated seconds between two replans of the fleet.
replan_window_seconds = 6.0
# Simulated seconds of waiting that add one priority point, so old orders do not starve.
priority_ageing_seconds = 3.75
# Simulated seconds with no robot progress and open orders before the fleet counts as stuck.
deadlock_patience_seconds = 450.0
# Simulated-second limit for one demo run.
timeout_seconds = 1800

# Distance in metres at which the driver stops for an obstacle.
# Chosen below the 0.5 m cell-to-wall distance so a wall never stops a robot,
# but above the 0.25 m near face of the dynamic box so that box always does.
driver_stop_distance = 0.4
# Forward speed of the Carter in metres per second.
driver_max_speed = 0.7
# Proportional turn gain.
driver_turn_gain = 2.0
# Maximum turn rate in radians per second.
driver_turn_limit = 1.6
# Distance in metres at which a waypoint counts as reached.
driver_goal_tolerance = 0.06
# Driver control steps per simulated second.
driver_control_rate_hz = 20.0
# Radius in metres the contact judge uses for a robot.
judge_robot_radius = 0.25
# Interface the dashboard listens on; 127.0.0.1 keeps it on this machine.
dashboard_bind_address = 127.0.0.1
# TCP port of the dashboard and JSON API.
dashboard_port = 8080
# Directory with the dashboard index.html, app.js and style.css.
dashboard_dir = service/dashboard
# Frames per second of the recorded overhead video.
video_fps = 10.0
